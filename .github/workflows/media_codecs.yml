name: NOMIKO Qt WebEngine media codec diagnostic (no Edge)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codecs:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install NOMIKO browser runtime
        shell: pwsh
        run: python -m pip install -r requirements.txt
      - name: Probe HTML5 codecs with Qt WebEngine (no external sites)
        shell: pwsh
        run: |
          python tools/qt_media_probe.py
          if ($LASTEXITCODE -ne 0) { throw 'Qt media probe did not complete' }
