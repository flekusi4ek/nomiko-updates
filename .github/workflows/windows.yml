name: NOMIKO Windows build and signed release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

# Only the newest push should publish a signed release for this branch.
concurrency:
  group: nomiko-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (build machine only)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip

      - name: Verify NOMIKO source is present
        shell: pwsh
        run: |
          foreach ($file in @('main.py', 'requirements.txt', 'src/update_trust.py', 'tools/sign_release.py', 'installer/NOMIKO.nsi', 'update_helper.py')) {
            if (-not (Test-Path $file)) { throw "Source file missing: $file. Upload the NOMIKO v0.9.0 source files before building." }
          }

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Generate Windows icon assets
        shell: pwsh
        run: |
          python tools/generate_icons.py
          if (!(Test-Path assets/NOMIKO.ico)) { throw 'Icon creation failed' }

      - name: Run offline tests
        shell: pwsh
        run: python -m unittest discover -s tests -q

      - name: Probe Windows native WebView2 media codecs
        shell: pwsh
        run: |
          python tools/native_media_probe.py
          if ($LASTEXITCODE -ne 0) { throw 'Native media probe failed.' }

      - name: Build NOMIKO
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name NOMIKO --icon assets/NOMIKO.ico --add-data 'assets/NOMIKO.ico;assets' --collect-all PySide6.QtWebEngineCore --collect-all PySide6.QtWebEngineWidgets --collect-all cryptography main.py

      - name: Smoke-test packaged Qt WebEngine imports
        shell: pwsh
        run: |
          python -c 'from PySide6.QtWebEngineCore import QWebEngineProfile; print("Unfrozen QtWebEngineCore import passed")'
          if ($LASTEXITCODE -ne 0) { throw 'Python QtWebEngineCore import failed on the runner.' }
          $exe = Join-Path (Get-Location).Path 'dist\\NOMIKO\\NOMIKO.exe'
          $check = Start-Process -FilePath $exe -ArgumentList '--self-check' -Wait -PassThru
          Write-Host "Packaged NOMIKO exit code: $($check.ExitCode)"
          if ($check.ExitCode -ne 0) {
            $diagnostic = Join-Path $env:TEMP 'NOMIKO-startup-diagnostic.txt'
            if (Test-Path $diagnostic) { Get-Content $diagnostic }
            throw 'Packaged NOMIKO QtWebEngineCore DLL import failed.'
          }

      - name: Smoke-test relocated NOMIKO files
        shell: pwsh
        run: |
          $target = Join-Path $env:TEMP 'NOMIKO-RelocationTest'
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          Copy-Item -LiteralPath 'dist\\NOMIKO' -Destination $target -Recurse
          $exe = Join-Path $target 'NOMIKO.exe'
          $check = Start-Process -FilePath $exe -ArgumentList '--self-check' -Wait -PassThru
          $code = $check.ExitCode
          Write-Host "Relocated NOMIKO exit code: $code"
          if ($code -ne 0) {
            $diagnostic = Join-Path $env:TEMP 'NOMIKO-startup-diagnostic.txt'
            if (Test-Path $diagnostic) { Get-Content $diagnostic }
            throw 'Relocated NOMIKO failed to load Qt.'
          }

      - name: Smoke-test first-frame rendering and tab switching
        shell: pwsh
        run: |
          python tools/gui_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'GUI web compositor smoke test failed.' }

      - name: Build independent update helper
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name NOMIKO-UpdateHelper --icon assets/NOMIKO.ico --distpath helper-dist update_helper.py
          Copy-Item helper-dist\NOMIKO-UpdateHelper.exe dist\NOMIKO\NOMIKO-UpdateHelper.exe

      - name: Smoke-test independent updater progress window
        shell: pwsh
        run: |
          $helper = Join-Path (Get-Location).Path 'helper-dist\NOMIKO-UpdateHelper.exe'
          $check = Start-Process -FilePath $helper -ArgumentList '--ui-self-check' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "Updater Tk window or progress UI failed: $($check.ExitCode)" }

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build per-user installer
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\NSIS\makensis.exe' installer\NOMIKO.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS installer failed." }
          $found = Get-ChildItem -Path . -Recurse -File -Filter 'NOMIKO-Setup-0.9.15.exe' | Select-Object -First 1
          if (-not $found) { throw "Installer was not generated." }
          $target = Join-Path (Get-Location).Path 'NOMIKO-Setup-0.9.15.exe'
          if ($found.FullName -ne $target) { Copy-Item -LiteralPath $found.FullName -Destination $target -Force }

      - name: Smoke-test installed NOMIKO
        shell: pwsh
        run: |
          $installer = Join-Path (Get-Location).Path 'NOMIKO-Setup-0.9.15.exe'
          $proc = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Silent installer failed with code $($proc.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\\NOMIKO\\NOMIKO.exe'
          if (-not (Test-Path $exe)) { throw 'NOMIKO.exe missing from installed folder.' }
          $passed = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            $check = Start-Process -FilePath $exe -ArgumentList '--self-check' -Wait -PassThru
            $code = $check.ExitCode
            Write-Host "Installed NOMIKO startup attempt $attempt exit code: $code"
            if ($code -eq 0) { $passed = $true; break }
            $diagnostic = Join-Path $env:TEMP 'NOMIKO-startup-diagnostic.txt'
            if (Test-Path $diagnostic) { Get-Content $diagnostic }
            Start-Sleep -Seconds 3
          }
          if (-not $passed) { throw 'Installed NOMIKO cannot import QtWebEngineCore after retries.' }

      - name: Verify in-app update helper upgrades the original custom folder
        shell: pwsh
        run: |
          $setup = Join-Path (Get-Location).Path 'NOMIKO-Setup-0.9.15.exe'
          $custom = Join-Path $env:LOCALAPPDATA 'Programs\\NOMIKO Custom Folder'
          $initial = Start-Process -FilePath $setup -ArgumentList "/S /D=$custom" -Wait -PassThru
          if ($initial.ExitCode -ne 0) { throw "Custom-folder initial installation failed: $($initial.ExitCode)" }
          $exe = Join-Path $custom 'NOMIKO.exe'
          if (-not (Test-Path $exe)) { throw 'Custom-folder installation missing NOMIKO.exe' }
          $marker = Join-Path $custom 'old-version-marker.txt'
          Set-Content -Path $marker -Value 'Previous version folder marker'
          $cache = Join-Path $env:LOCALAPPDATA 'NOMIKO\\updates'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          $cachedSetup = Join-Path $cache 'NOMIKO-Setup-0.9.15.exe'
          Copy-Item -LiteralPath $setup -Destination $cachedSetup -Force
          $sha = (Get-FileHash -LiteralPath $cachedSetup -Algorithm SHA256).Hash.ToLowerInvariant()
          $helper = Join-Path (Get-Location).Path 'helper-dist\\NOMIKO-UpdateHelper.exe'
          $sleeper = Start-Process -FilePath 'powershell.exe' -ArgumentList '-NoProfile -Command "Start-Sleep -Seconds 5"' -PassThru -WindowStyle Hidden
          $arguments = @('--pid', "$($sleeper.Id)", '--installer', "`"$cachedSetup`"",
                         '--sha256', $sha, '--app-dir', "`"$custom`"", '--silent')
          $update = Start-Process -FilePath $helper -ArgumentList $arguments -Wait -PassThru
          if ($update.ExitCode -ne 0) {
            $statusFile = Join-Path $cache 'last-update-status.txt'
            if (Test-Path $statusFile) { Get-Content $statusFile }
            throw "NOMIKO helper exited with $($update.ExitCode)"
          }
          if (-not (Test-Path $exe) -or (Test-Path $marker)) {
            throw 'Helper did not replace the original custom install folder.'
          }
          $status = Get-Content (Join-Path $cache 'last-update-status.txt') -Raw
          if (-not $status.Contains('Update installed.')) { throw "Helper did not report success: $status" }
          $check = Start-Process -FilePath $exe -ArgumentList '--self-check' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw 'Updated custom NOMIKO.exe failed native Qt self-check.' }

      - name: Build portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\NOMIKO\* -DestinationPath NOMIKO-Windows-portable.zip -CompressionLevel Optimal

      - name: Upload unsigned CI build for Windows smoke testing
        uses: actions/upload-artifact@v4
        with:
          name: nomiko-windows-test-build
          path: |
            NOMIKO-Windows-portable.zip
            NOMIKO-Setup-*.exe

      - name: Check explicit signed release request
        id: gate
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c 'from src.update_trust import CURRENT_VERSION; print(CURRENT_VERSION)'
          $tag = "v$version"
          if (!(Test-Path '.github/release-request.txt')) {
            'publish=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          $request = (Get-Content '.github/release-request.txt' -Raw).Trim()
          if ($request -ne "PUBLISH $tag") { throw "Release request '$request' does not match $tag" }
          # 'gh release view' exits with 1 for a missing release, which PowerShell
          # may treat as a terminating native-command error. Listing is safe.
          $releaseTags = gh release list --repo '${{ github.repository }}' --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to list GitHub releases' }
          if (@($releaseTags | Where-Object { $_.tagName -eq $tag }).Count -gt 0) {
            'publish=false' >> $env:GITHUB_OUTPUT
            Write-Host "Already released: $tag"
          } else {
            'publish=true' >> $env:GITHUB_OUTPUT
            "version=$version" >> $env:GITHUB_OUTPUT
            "tag=$tag" >> $env:GITHUB_OUTPUT
          }

      - name: Sign update manifest
        if: steps.gate.outputs.publish == 'true'
        shell: pwsh
        env:
          NOMIKO_SIGNING_KEY_B64: ${{ secrets.NOMIKO_SIGNING_KEY_B64 }}
        run: |
          if (-not $env:NOMIKO_SIGNING_KEY_B64) { throw 'NOMIKO_SIGNING_KEY_B64 is missing' }
          $version = '${{ steps.gate.outputs.version }}'
          python tools/sign_release.py --version $version --channel stable --installer "NOMIKO-Setup-$version.exe" --out release --notes 'Standalone installer progress window and launch button after browser closes.'
          if ($LASTEXITCODE -ne 0) { throw 'Signing failed' }

      - name: Publish signed GitHub Release
        if: steps.gate.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.gate.outputs.tag }}'
          $version = '${{ steps.gate.outputs.version }}'
          gh release create $tag "NOMIKO-Setup-$version.exe" NOMIKO-Windows-portable.zip release/update.json release/update.sig --repo '${{ github.repository }}' --target '${{ github.sha }}' --title "NOMIKO $version Stable" --notes 'Stable release: standalone animated updater window with real installation stages and one-click relaunch. Signed update manifest; no Authenticode signature.'
          if ($LASTEXITCODE -ne 0) { throw 'Publishing release failed' }
